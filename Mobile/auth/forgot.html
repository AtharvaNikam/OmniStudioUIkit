<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Omni Studio — Reset password</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../styles.css" />
</head>
<body>
<div class="phone">

  <div class="status-bar">
    <span class="status-bar__time">9:41</span>
    <span class="status-bar__icons">
      <span class="bars"><span></span><span></span><span></span><span></span></span>
      <svg width="16" height="11" viewBox="0 0 16 11" fill="none" aria-hidden="true">
        <path d="M2 4 C 4 2 12 2 14 4" stroke="#0A0E12" stroke-width="1.4" fill="none" stroke-linecap="round"/>
        <path d="M5 7 C 6.5 5.5 9.5 5.5 11 7" stroke="#0A0E12" stroke-width="1.4" fill="none" stroke-linecap="round"/>
        <circle cx="8" cy="9.5" r="0.8" fill="#0A0E12"/>
      </svg>
      <span class="battery"><span></span></span>
    </span>
  </div>

  <header class="app-header">
    <a class="app-header__back" href="../index.html" aria-label="Back to sign in">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <div class="app-header__title-stack">
      <span class="app-header__eyebrow">Account recovery</span>
      <span class="app-header__title">Reset your password</span>
    </div>
    <span class="app-header__action" aria-hidden="true" style="background:transparent; border:0;"></span>
  </header>

  <main class="content" style="padding-top:16px;">

    <p class="section-subtitle" style="margin-top:0;">Enter the email on your account. We'll send you a one-time link — good for 15 minutes.</p>

    <div class="form-field">
      <span class="form-field__label">Email</span>
      <label class="form-field__input">
        <svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
        <input type="email" placeholder="you@phoenixhvac.com" autocomplete="email" />
      </label>
    </div>

    <a class="btn btn--accent btn--wide" href="#">Send reset link <span class="arrow">→</span></a>

    <div class="row" style="gap:12px; align-items:center; margin: 4px 0;">
      <span style="flex:1; height:1px; background:var(--border);"></span>
      <span class="mono" style="font-size:10px; color:var(--text-dim); letter-spacing:0.14em; text-transform:uppercase;">or</span>
      <span style="flex:1; height:1px; background:var(--border);"></span>
    </div>

    <a href="#" class="card" style="display:flex; align-items:center; gap:14px; padding:14px 16px; text-decoration:none;">
      <span style="display:inline-flex; width:36px; height:36px; border-radius:10px; background:var(--bone-100); color:var(--ink); align-items:center; justify-content:center; flex-shrink:0;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="3" width="12" height="18" rx="2"/><path d="M11 19h2"/></svg>
      </span>
      <div style="flex:1;">
        <div style="font-weight:500; color:var(--ink); font-size:14px;">Use SMS to my phone</div>
        <div class="mono" style="font-size:11px; color:var(--text-mute); margin-top:2px; letter-spacing:0.04em;">Code to ••• ••• 0142</div>
      </div>
      <span class="mono" style="font-size:11px; color:var(--signal-700); letter-spacing:0.06em;">→</span>
    </a>

    <a href="#" class="card" style="display:flex; align-items:center; gap:14px; padding:14px 16px; text-decoration:none;">
      <span style="display:inline-flex; width:36px; height:36px; border-radius:10px; background:var(--bone-100); color:var(--ink); align-items:center; justify-content:center; flex-shrink:0;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="9" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/></svg>
      </span>
      <div style="flex:1;">
        <div style="font-weight:500; color:var(--ink); font-size:14px;">Use a passkey</div>
        <div class="mono" style="font-size:11px; color:var(--text-mute); margin-top:2px; letter-spacing:0.04em;">Face ID · 1 saved</div>
      </div>
      <span class="mono" style="font-size:11px; color:var(--signal-700); letter-spacing:0.06em;">→</span>
    </a>

    <p class="mono" style="font-size:11px; color:var(--text-dim); letter-spacing:0.06em; text-align:center; margin-top:14px;">Trouble? <a href="#" style="color:var(--signal-700);">Contact support</a></p>

  </main>

</div>
</body>
</html>
