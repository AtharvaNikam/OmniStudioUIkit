<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Omni Studio — Onboarding · Address</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../styles.css" />
</head>
<body>
<div class="phone">

  <div class="status-bar">
    <span class="status-bar__time">9:41</span>
    <span class="status-bar__icons">
      <span class="bars"><span></span><span></span><span></span><span></span></span>
      <svg width="16" height="11" viewBox="0 0 16 11" fill="none" aria-hidden="true">
        <path d="M2 4 C 4 2 12 2 14 4" stroke="#0A0E12" stroke-width="1.4" fill="none" stroke-linecap="round"/>
        <path d="M5 7 C 6.5 5.5 9.5 5.5 11 7" stroke="#0A0E12" stroke-width="1.4" fill="none" stroke-linecap="round"/>
        <circle cx="8" cy="9.5" r="0.8" fill="#0A0E12"/>
      </svg>
      <span class="battery"><span></span></span>
    </span>
  </div>

  <header class="app-header">
    <a class="app-header__back" href="contact.html" aria-label="Back">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <div class="app-header__title-stack">
      <span class="app-header__eyebrow">Step 2 of 5 · Address</span>
      <span class="app-header__title">Where the work is</span>
    </div>
    <a class="app-header__action" href="../index.html" aria-label="Cancel">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M6 18L18 6"/></svg>
    </a>
  </header>

  <div style="padding: 14px 18px 0;">
    <div class="stepper">
      <span class="stepper__dot is-done"></span>
      <span class="stepper__dot is-current"></span>
      <span class="stepper__dot"></span>
      <span class="stepper__dot"></span>
      <span class="stepper__dot"></span>
    </div>
  </div>

  <main class="content" style="padding-top:12px;">

    <p class="section-subtitle" style="margin-top:0;">We pin this on the map for the dispatcher and the on-call tech. We don't share it anywhere else.</p>

    <button type="button" class="btn btn--ghost btn--wide" style="justify-content:flex-start; gap:10px; padding:14px 18px;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
      Use my current location
    </button>

    <div class="row" style="gap:12px; align-items:center; margin: 4px 0;">
      <span style="flex:1; height:1px; background:var(--border);"></span>
      <span class="mono" style="font-size:10px; color:var(--text-dim); letter-spacing:0.14em; text-transform:uppercase;">or enter manually</span>
      <span style="flex:1; height:1px; background:var(--border);"></span>
    </div>

    <div class="form-field">
      <span class="form-field__label">Street address</span>
      <label class="form-field__input">
        <svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8v10a1 1 0 01-1 1h-5v-7H9v7H4a1 1 0 01-1-1V11z"/></svg>
        <input type="text" placeholder="1204 E Oak St" autocomplete="street-address" />
      </label>
    </div>

    <div class="form-field">
      <span class="form-field__label">Unit / suite · optional</span>
      <label class="form-field__input">
        <input type="text" placeholder="Apt 3B" autocomplete="address-line2" />
      </label>
    </div>

    <div class="form-field form-field--row">
      <div class="form-field" style="flex:2;">
        <span class="form-field__label">City</span>
        <label class="form-field__input">
          <input type="text" placeholder="Phoenix" autocomplete="address-level2" />
        </label>
      </div>
      <div class="form-field" style="flex:1;">
        <span class="form-field__label">State</span>
        <label class="form-field__input">
          <input type="text" placeholder="AZ" autocomplete="address-level1" />
        </label>
      </div>
    </div>

    <div class="form-field">
      <span class="form-field__label">ZIP</span>
      <label class="form-field__input" style="max-width:60%;">
        <input type="text" inputmode="numeric" placeholder="85008" autocomplete="postal-code" />
      </label>
    </div>

    <span class="eyebrow" style="margin-top:6px;">Map preview</span>
    <div class="map-stage" style="height:200px;">
      <svg class="map-stage__svg" viewBox="0 0 360 200" preserveAspectRatio="none" aria-hidden="true">
        <rect x="0" y="0" width="360" height="200" fill="url(#mg)"/>
        <defs>
          <linearGradient id="mg" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#f5efe1"/>
            <stop offset="100%" stop-color="#e8e2d3"/>
          </linearGradient>
        </defs>
        <path class="map-stage__roads" d="M0 60 Q 80 70 180 65 T 360 80"/>
        <path class="map-stage__roads" d="M0 130 Q 100 120 200 130 T 360 140"/>
        <path class="map-stage__roads-secondary" d="M120 0 L 130 200"/>
        <path class="map-stage__roads-secondary" d="M240 0 L 230 200"/>
        <rect class="map-stage__block" x="20" y="80" width="80" height="40" rx="4"/>
        <rect class="map-stage__block" x="140" y="80" width="80" height="40" rx="4"/>
        <rect class="map-stage__block" x="260" y="85" width="80" height="35" rx="4"/>
        <rect class="map-stage__block" x="20" y="150" width="100" height="40" rx="4"/>
        <rect class="map-stage__block" x="240" y="155" width="100" height="35" rx="4"/>
      </svg>
      <span class="map-stage__pin" style="left: calc(50% - 18px); top: calc(50% - 18px);"></span>
      <span class="map-stage__chip" style="top: 14px; left: 50%; transform: translateX(-50%);">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 21s7-7 7-12a7 7 0 10-14 0c0 5 7 12 7 12z"/><circle cx="12" cy="9" r="2.5"/></svg>
        1204 E Oak · Phoenix
      </span>
    </div>

  </main>

  <nav class="tabbar" aria-label="Onboarding actions" style="grid-template-columns: auto 1fr; padding: 12px 18px 22px; gap:10px; height:auto;">
    <a class="btn btn--ghost" href="contact.html">Back</a>
    <a class="btn btn--accent" href="property.html">Continue <span class="arrow">→</span></a>
  </nav>

</div>
</body>
</html>
